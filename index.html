function addBox(
  x,y,z,
  sx,sy,sz,
  material,
  collision=true
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      sx,sy,sz
    ),
    material
  );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  world.add(mesh);


  if(collision){

    colliders.push({
      x:x,
      z:z,
      w:sx/2,
      d:sz/2
    });

  }

  return mesh;
}

/* =========================================================
   COLLISION
========================================================= */

function collisionAt(
  x,z
){

  for(
    const c of colliders
  ){

    const dx =
      Math.max(
        Math.abs(x-c.x)-c.w,
        0
      );

    const dz =
      Math.max(
        Math.abs(z-c.z)-c.d,
        0
      );

    if(
      dx*dx+dz*dz <
      player.radius*
      player.radius
    ){

      return true;
    }

  }

  return false;
}

      document.pointerLockElement ===
      document.body;

  }
);


document.addEventListener(
  "mousemove",
  e=>{

    if(!mouseLocked)
      return;

    yaw -=
      e.movementX*0.0025;

    pitch -=
      e.movementY*0.0025;

    pitch =
      Math.max(
        -1.45,
        Math.min(
          1.45,
          pitch
        )
      );

  }
);


/* =========================================================
   FIREBASE JOIN
========================================================= */

joinBtn.addEventListener(
  "click",
  joinRoom
);


async function joinRoom(){

  errorBox.textContent="";

  playerName =
    nameInput.value.trim();

  roomCode =
    roomInput.value
      .trim()
      .toUpperCase();


  if(!playerName){

    errorBox.textContent=
      "Bitte Namen eingeben.";

    return;

  }


  if(!roomCode){

    errorBox.textContent=
      "Bitte Raumcode eingeben.";

    return;

  }


  joinBtn.disabled=true;


  try{

    const playersRef =
      ref(
        db,
        "rooms/"+roomCode+
        "/players"
      );


    const snap =
      await get(playersRef);


    const current =
      snap.exists()
      ? snap.val()
      : {};


    const count =
      Object.keys(current).length;


    if(count>=10){

      errorBox.textContent=
        "Der Raum ist voll.";

      joinBtn.disabled=false;

      return;

    }


    const newRef =
      push(playersRef);


    playerId =
      newRef.key;


    isHost =
      count===0;


    player.color =
      randomColor();


    player.x =
      (Math.random()-.5)*30;

    player.z =
      (Math.random()-.5)*30;


    await set(
      newRef,
      {

        name:playerName,

        x:player.x,

        y:player.y,

        z:player.z,

        color:player.color,

        ready:false,

        host:isHost,

        online:true

      }
    );


    onDisconnect(
      newRef
    ).remove();


    roomLabel.textContent=
      roomCode;


    hudName.textContent=
      playerName;


    startScreen.style.display=
      "none";

    lobby.style.display=
      "flex";


    listenPlayers();
    listenStarted();


  }catch(err){

    console.error(err);

    errorBox.textContent=
      "Firebase Fehler: "+
      err.message;

    joinBtn.disabled=false;

  }

}


/* =========================================================
   PLAYER LISTENER
========================================================= */

function listenPlayers(){

  const r =
    ref(
      db,
      "rooms/"+roomCode+
      "/players"
    );


  onValue(
    r,
    snap=>{

      players =
        snap.exists()
        ? snap.val()
        : {};


      renderLobby();

      updateStartButton();

      updateRemotePlayers();

    }
  );

}


/* =========================================================
   LOBBY
========================================================= */

function renderLobby(){

  playerList.innerHTML="";

  Object.keys(players)
  .forEach(id=>{

    const p =
      players[id];


    const row =
      document.createElement(
        "div"
      );

    row.className=
      "player";


    const left =
      document.createElement(
        "div"
      );

    left.className=
      "playerLeft";


    const dot =
      document.createElement(
        "div"
      );

    dot.className=
      "dot";

    dot.style.background=
      p.color || "#fff";


    const name =
      document.createElement(
        "span"
      );

    name.textContent=
      p.name || "Spieler";


    if(p.host){

      name.textContent +=
        " ★";

    }


    left.appendChild(dot);
    left.appendChild(name);


    const state =
      document.createElement(
        "span"
      );


    if(p.ready){

      state.textContent=
        "BEREIT";

      state.className=
        "ready";

    }else{

      state.textContent=
        "WARTET";

      state.className=
        "waiting";

    }


    row.appendChild(left);
    row.appendChild(state);

    playerList.appendChild(row);

  });

}

   START BUTTON
========================================================= */

function updateStartButton(){

  if(!isHost){

    startBtn.style.display=
      "none";

    return;

  }


  startBtn.style.display=
    "block";


  const ids =
    Object.keys(players);

    );


  startBtn.disabled=

  startBtn.textContent=
    allReady

   START
========================================================= */

startBtn.addEventListener(
  "click",

/* =========================================================
   GAME START LISTENER
========================================================= */

function listenStarted(){

  onValue(
    ref(
      db,
      "rooms/"+roomCode+
      "/started"
    ),
    snap=>{

      if(
        snap.val()===true
      ){

        startGame();

      }

    }
  );

/* =========================================================
   START GAME
========================================================= */

function startGame(){

  if(gameStarted)
    return;


  gameStarted=true;

  lobby.style.display=
    "none";

  gameUI.style.display=
    "block";


  camera.position.set(
    player.x,
    player.y,
    player.z
  );


  renderer.domElement
    .requestPointerLock();


  lastTime=
    performance.now();


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(){

  if(!gameStarted)
    return;


  for(
    const id of Object.keys(players)
  ){

    if(id===playerId)
      continue;


    const p =
      players[id];


    if(
      !remoteMeshes[id]
    ){

      remoteMeshes[id]=
        createRemotePlayer(
          p.color || "#5577ff"
        );

    }


    const mesh =
      remoteMeshes[id];


    mesh.position.set(
      p.x || 0,
      (p.y || 1.7)-1.7,
      p.z || 0
    );

  }


  for(
    const id of Object.keys(
      remoteMeshes
    )
  ){

    if(!players[id]){

      world.remove(
        remoteMeshes[id]
      );

      delete remoteMeshes[id];

    }

  }

}


/* =========================================================
   PHYSICS
========================================================= */

const gravity=
-18;

const jumpPower=
7;


function updatePlayer(dt){

  let forward=0;
  let strafe=0;


  if(
    keys.w ||
    keys.arrowup
  ){
    forward+=1;
  }

  if(
    keys.s ||
    keys.arrowdown
  ){
    forward-=1;
  }

  if(
    keys.a ||
    keys.arrowleft
  ){
    strafe-=1;
  }

  if(
    keys.d ||
    keys.arrowright
  ){
    strafe+=1;
  }


  const len =
    Math.hypot(
      forward,
      strafe
    );


  if(len>0){

    forward/=len;
    strafe/=len;

  }


  /* camera direction */

  const forwardVec =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const rightVec =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  const move =
    new THREE.Vector3();


  move.addScaledVector(
    forwardVec,
    forward*player.speed*dt
  );


  move.addScaledVector(
    rightVec,
    strafe*player.speed*dt
  );


  const nx =
    player.x+move.x;

  const nz =
    player.z+move.z;


  if(
    !collisionAt(nx,player.z)
  ){

    player.x=nx;

  }


  if(
    !collisionAt(player.x,nz)
  ){

    player.z=nz;

  }


  /* jump */

  if(
    keys.space &&
    player.onGround
  ){

    player.vy=
      jumpPower;

    player.onGround=false;

    keys.space=false;

  }


  /* gravity */

  player.vy +=
    gravity*dt;


  player.y +=
    player.vy*dt;


  if(
    player.y<=1.7
  ){

    player.y=1.7;

    player.vy=0;

    player.onGround=true;

  }


  camera.position.set(
    player.x,
    player.y,
    player.z
  );


  camera.rotation.order=
    "YXZ";

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;

}


/* =========================================================
   SEND POSITION
========================================================= */

let sendTimer=0;


function sendPosition(dt){

  sendTimer+=dt;


  if(
    sendTimer<.05
  )
    return;


  sendTimer=0;


  if(!playerId)
    return;


  update(
    ref(
      db,
      "rooms/"+roomCode+
      "/players/"+playerId
    ),
    {
      x:player.x,
      y:player.y,
      z:player.z
    }
  );

}


/* =========================================================
   BLOOD RAIN
========================================================= */

const rainParticles=[];

const rainGroup=
new THREE.Group();

world.add(rainGroup);


function createBloodRain(){

  for(let i=0;i<140;i++){

    const material =
      new THREE.LineBasicMaterial({
        color:0x8c1111,
        transparent:true,
        opacity:.65
      });


    const points=[];

    const x=
      player.x+
      (Math.random()-.5)*80;

    const z=
      player.z+
      (Math.random()-.5)*80;

    const y=
      10+
      Math.random()*35;


    points.push(
      new THREE.Vector3(
        x,y,z
      )
    );

    points.push(
      new THREE.Vector3(
        x,
        y-.8-Math.random()*1.2,
        z
      )
    );


    const geometry =
      new THREE.BufferGeometry()
        .setFromPoints(points);


    const line =
      new THREE.Line(
        geometry,
        material
      );


    rainGroup.add(line);


    rainParticles.push({
      mesh:line,
      speed:10+
        Math.random()*12
    });

  }

}


createBloodRain();


function updateBloodRain(dt){

  for(
    const p of rainParticles
  ){

    p.mesh.position.y -=
      p.speed*dt;


    if(
      p.mesh.position.y<
      .1
    ){

      p.mesh.position.y=
        20+
        Math.random()*20;

      p.mesh.position.x=
        player.x+
        (Math.random()-.5)*80;

      p.mesh.position.z=
        player.z+
        (Math.random()-.5)*80;

    }

  }

}


/* =========================================================
   BLOOD WEATHER TIMER
========================================================= */

let bloodActive=false;

let bloodTimer=
  25+
  Math.random()*35;


function updateBloodWeather(dt){

  bloodTimer-=dt;


  if(
    bloodTimer<=0
  ){

    bloodActive=
      !bloodActive;


    bloodTimer=
      bloodActive
      ? 8+Math.random()*7
      : 20+Math.random()*45;


    bloodOverlay.style.opacity=
      bloodActive
      ? ".22"
      : "0";

  }

}


/* =========================================================
   AMBIENT FOG MOVEMENT
========================================================= */

let fogTime=0;


function updateAtmosphere(dt){

  fogTime+=dt;


  scene.fog.density=
    0.010+
    Math.sin(fogTime*.15)*.0015;

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
performance.now();


function gameLoop(time){

  if(!gameStarted)
    return;


  let dt=
    (time-lastTime)/1000;


  lastTime=time;


  dt=
    Math.min(
      dt,
      .05
    );


  updatePlayer(dt);

  sendPosition(dt);

  updateRemotePlayers();

  updateBloodRain(dt);

  updateBloodWeather(dt);

  updateAtmosphere(dt);


  renderer.render(
    scene,
    camera
  );


  requestAnimationFrame(
    gameLoop
  );

}
