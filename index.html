joinBtn.addEventListener("click",joinRoom);

async function joinRoom(){

  errorBox.textContent="";

  playerName = nameInput.value.trim();
  roomCode = roomInput.value.trim().toUpperCase();

  if(!playerName){
    errorBox.textContent="Bitte Namen eingeben.";
    return;
  }

  if(!roomCode){
    errorBox.textContent="Bitte Raumcode eingeben.";
    return;
  }

  if(roomCode.length < 2){
    errorBox.textContent="Der Raumcode ist zu kurz.";
    return;
  }

  joinBtn.disabled=true;
  joinBtn.textContent="Verbinde...";

  try{

    const roomPlayersRef =
      ref(db,"rooms/"+roomCode+"/players");

    const snapshot =
      await get(roomPlayersRef);

    let currentPlayers =
      snapshot.exists()
      ? snapshot.val()
      : {};

    const count =
      Object.keys(currentPlayers).length;

    if(count >= 10){

      errorBox.textContent =
        "Der Raum ist voll.";

      joinBtn.disabled=false;
      joinBtn.textContent="Raum betreten";

      return;
    }


    const newPlayerRef =
      push(roomPlayersRef);

    playerId = newPlayerRef.key;

    isHost = count === 0;

    isReady = false;


    me.x =
      500 + Math.random()*200;

    me.y =
      500 + Math.random()*200;

    me.color =
      randomColor();


    await set(newPlayerRef,{
      name:playerName,
      x:me.x,
      y:me.y,
      color:me.color,
      ready:false,
      host:isHost,
      online:true
    });


    onDisconnect(newPlayerRef)
      .remove();


    roomLabel.textContent =
      roomCode;

    myNameUI.textContent =
      playerName;


    startScreen.style.display="none";
    lobby.style.display="flex";


    listenToPlayers();
    listenToGame();


  }catch(err){

    console.error(err);

    errorBox.textContent =
      "Firebase-Fehler: "+err.message;

    joinBtn.disabled=false;
    joinBtn.textContent="Raum betreten";
  }
}

    Object.keys(players);

      "<div style='text-align:center;color:#777'>Keine Spieler</div>";

      name.appendChild(host);

      state.className =
        "notReady";
    }


    row.appendChild(left);
    row.appendChild(state);

    playerList.appendChild(row);

  });

}

/* =========================================================
   MAP
========================================================= */

const map = {

  width:5000,
  height:5000,

  houses:[
    {x:400,y:350,w:500,h:350},
    {x:1500,y:500,w:600,h:400},
    {x:2900,y:350,w:750,h:450},
    {x:800,y:1500,w:700,h:450},
    {x:2200,y:1500,w:500,h:350},
    {x:3600,y:1500,w:650,h:500},
    {x:400,y:2900,w:700,h:450},
    {x:1700,y:2700,w:650,h:500},
    {x:3000,y:2900,w:850,h:450},
    {x:4100,y:3800,w:550,h:450}
  ],

  trees:[],

  rocks:[]
};


/* =========================================================
   CREATE TREES
========================================================= */

for(let i=0;i<180;i++){

  let x =
    100+Math.random()*4800;

  let y =
    100+Math.random()*4800;

  let blocked =
    map.houses.some(h=>
      x>h.x-80 &&
      x<h.x+h.w+80 &&
      y>h.y-80 &&
      y<h.y+h.h+80
    );

  if(!blocked){

    map.trees.push({
      x,
      y,
      r:28
    });

  }
}


/* =========================================================
   CREATE ROCKS
========================================================= */

for(let i=0;i<80;i++){

  let x =
    100+Math.random()*4800;

  let y =
    100+Math.random()*4800;

  let blocked =
    map.houses.some(h=>
      x>h.x-50 &&
      x<h.x+h.w+50 &&
      y>h.y-50 &&
      y<h.y+h.h+50
    );

  if(!blocked){

    map.rocks.push({
      x,
      y,
      r:18
    });

  }
}


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(
  cx,cy,r,rect
){

  const closestX =
    Math.max(
      rect.x,
      Math.min(cx,rect.x+rect.w)
    );

  const closestY =
    Math.max(
      rect.y,
      Math.min(cy,rect.y+rect.h)
    );

  const dx =
    cx-closestX;

  const dy =
    cy-closestY;

  return dx*dx+dy*dy < r*r;
}


function blocked(x,y){

  for(const h of map.houses){

    if(
      circleRectCollision(
        x,y,me.radius,h
      )
    ){
      return true;
    }

  }


  for(const t of map.trees){

    const dx=x-t.x;
    const dy=y-t.y;

    const dist =
      Math.sqrt(dx*dx+dy*dy);

    if(
      dist <
      me.radius+t.r
    ){
      return true;
    }

  }


  for(const r of map.rocks){

    const dx=x-r.x;
    const dy=y-r.y;

    const dist =
      Math.sqrt(dx*dx+dy*dy);

    if(
      dist <
      me.radius+r.r
    ){
      return true;
    }

  }


  return false;
}


/* =========================================================
   MOVEMENT
========================================================= */

let lastTime =
  performance.now();

let sendTimer=0;

function updateGame(dt){

  let dx=0;
  let dy=0;


  if(
    keys["w"] ||
    keys["arrowup"]
  ){
    dy-=1;
  }

  if(
    keys["s"] ||
    keys["arrowdown"]
  ){
    dy+=1;
  }

  if(
    keys["a"] ||
    keys["arrowleft"]
  ){
    dx-=1;
  }

  if(
    keys["d"] ||
    keys["arrowright"]
  ){
    dx+=1;
  }


  if(dx!==0 || dy!==0){

    const len =
      Math.sqrt(dx*dx+dy*dy);

    dx/=len;
    dy/=len;


    const nx =
      me.x+
      dx*me.speed*dt;

    const ny =
      me.y+
      dy*me.speed*dt;


    if(!blocked(nx,me.y)){
      me.x=nx;
    }

    if(!blocked(me.x,ny)){
      me.y=ny;
    }

  }


  me.x =
    Math.max(
      me.radius,
      Math.min(
        map.width-me.radius,
        me.x
      )
    );

  me.y =
    Math.max(
      me.radius,
      Math.min(
        map.height-me.radius,
        me.y
      )
    );


  camera.x =
    me.x-canvas.width/2;

  camera.y =
    me.y-canvas.height/2;


  camera.x =
    Math.max(
      0,
      Math.min(
        map.width-canvas.width,
        camera.x
      )
    );

  camera.y =
    Math.max(
      0,
      Math.min(
        map.height-canvas.height,
        camera.y
      )
    );


  sendTimer+=dt;


  if(sendTimer>0.05){

    sendTimer=0;

    if(playerId){

      update(
        ref(
          db,
          "rooms/"+roomCode+
          "/players/"+playerId
        ),
        {
          x:me.x,
          y:me.y
        }
      );

    }

  }

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

  ctx.fillStyle="#101713";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /* GROUND */

  ctx.fillStyle="#17221a";

  ctx.fillRect(
    0,
    0,
    map.width,
    map.height
  );


  /* GRASS */

  ctx.fillStyle="#1c2a20";

  for(let x=0;x<map.width;x+=80){

    for(let y=0;y<map.height;y+=80){

      ctx.fillRect(
        x+20,
        y+30,
        2,
        2
      );

    }

  }


  /* ROADS */

  ctx.fillStyle="#302d27";

  ctx.fillRect(
    0,
    1150,
    map.width,
    160
  );

  ctx.fillRect(
    2350,
    0,
    180,
    map.height
  );


  /* ROAD CENTER */

  ctx.strokeStyle="#49453d";
  ctx.lineWidth=3;

  ctx.setLineDash([25,25]);

  ctx.beginPath();

  ctx.moveTo(
    0,
    1230
  );

  ctx.lineTo(
    map.width,
    1230
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    2440,
    0
  );

  ctx.lineTo(
    2440,
    map.height
  );

  ctx.stroke();

  ctx.setLineDash([]);


  /* HOUSES */

  for(const h of map.houses){

    /* shadow */

    ctx.fillStyle=
      "rgba(0,0,0,.35)";

    ctx.fillRect(
      h.x+18,
      h.y+18,
      h.w,
      h.h
    );


    /* wall */

    ctx.fillStyle="#8b8170";

    ctx.fillRect(
      h.x,
      h.y,
      h.w,
      h.h
    );


    /* roof */

    ctx.fillStyle="#493b35";

    ctx.beginPath();

    ctx.moveTo(
      h.x-30,
      h.y
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-70
    );

    ctx.lineTo(
      h.x+h.w+30,
      h.y
    );

    ctx.closePath();

    ctx.fill();


    /* door */

    ctx.fillStyle="#34261f";

    ctx.fillRect(
      h.x+h.w/2-25,
      h.y+h.h-85,
      50,
      85
    );


    /* windows */

    ctx.fillStyle="#a9d3d6";

    const wy =
      h.y+100;

    ctx.fillRect(
      h.x+70,
      wy,
      70,
      55
    );

    ctx.fillRect(
      h.x+h.w-140,
      wy,
      70,
      55
    );

  }


  /* TREES */

  for(const t of map.trees){

    ctx.fillStyle=
      "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
      t.x,
      t.y+25,
      32,
      13,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#513b27";

    ctx.fillRect(
      t.x-7,
      t.y,
      14,
      35
    );


    ctx.fillStyle="#244b2d";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y-10,
      t.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#316139";

    ctx.beginPath();

    ctx.arc(
      t.x-15,
      t.y-22,
      20,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* ROCKS */

  for(const r of map.rocks){

    ctx.fillStyle="#4d5150";

    ctx.beginPath();

    ctx.arc(
      r.x,
      r.y,
      r.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* OTHER PLAYERS */

  for(const id in players){

    if(id===playerId)
      continue;

    const p =
      players[id];

    if(
      typeof p.x!=="number" ||
      typeof p.y!=="number"
    )
      continue;


    drawPlayer(
      p.x,
      p.y,
      p.color || "#fff",
      p.name || "Spieler"
    );

  }


  /* MY PLAYER */

  drawPlayer(
    me.x,
    me.y,
    me.color,
    playerName
  );


  ctx.restore();

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(
  x,
  y,
  color,
  name
){

  /* shadow */

  ctx.fillStyle=
    "rgba(0,0,0,.4)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+17,
    18,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* body */

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.arc(
    x,
    y+3,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* head */

  ctx.fillStyle="#e3b08e";

  ctx.beginPath();

  ctx.arc(
    x,
    y-13,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* name */

  ctx.font=
    "12px Arial";

  ctx.textAlign=
    "center";

  ctx.fillStyle=
    "white";

  ctx.fillText(
    name,
    x,
    y-30
  );

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

  if(!gameStarted)
    return;


  let dt =
    (time-lastTime)/1000;

  lastTime=time;

  dt =
    Math.min(dt,.05);


  updateGame(dt);
  drawWorld();


  requestAnimationFrame(gameLoop);
}

   INITIAL MESSAGE
========================================================= */

console.log(

);
